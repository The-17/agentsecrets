# Cloud mode is one decision, set once by the platform. The binary is bundled in
# the npm package (Phase 1), so there is no GitHub fetch at boot.
services:
  app:
    build: .
    environment:
      AGENTSECRETS_MODE: cloud
      # Injected by the orchestrator / CI secret store, never committed.
      AGENTSECRETS_TOKEN: ${AGENTSECRETS_TOKEN}
    # `npx agentsecrets` resolves the locally-installed launcher from
    # node_modules/.bin, so the command works without putting it on PATH by
    # hand. `agentsecrets env --` resolves via POST /api/workloads/env/ and
    # execs the app.
    command: ["npx", "agentsecrets", "env", "--", "node", "server.js"]
