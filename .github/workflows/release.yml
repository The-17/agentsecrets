# .github/workflows/release.yml
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    name: Release Binaries (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod requires 1.26 for the OPAQUE sidecar's bytemare/opaque.
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Build the container-safe platform artifacts (PyPI platform wheels + npm
  # platform packages) via the packaging lever. The wrappers resolve these
  # bundled binaries first, so an install works on a read-only, no-network
  # container with no GitHub fetch at boot.
  package:
    name: Build Platform Artifacts
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: python -m pip install --upgrade build hatchling twine

      - name: Build version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Sync version into pyproject.toml and npm/package.json
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          sed -i "s/^version = .*/version = \"$VERSION\"/" pypi/pyproject.toml
          (cd npm && npm version "$VERSION" --allow-same-version --no-git-tag-version)

      - name: Build wheels + npm platform packages
        run: python scripts/package-platforms.py --version "${{ steps.tag.outputs.version }}"

      - name: Upload PyPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/agentsecrets_cli-*.whl

      - name: Upload npm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: dist/the-17-agentsecrets-*.tgz

  publish-pypi:
    name: Publish Package (PyPI)
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download PyPI artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/agentsecrets_cli-*.whl

  publish-npm:
    name: Publish Package (NPM)
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download npm artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          shopt -s nullglob
          for tgz in dist/the-17-agentsecrets-*.tgz; do
            echo "publishing $tgz"
            npm publish --access public "$tgz"
          done
