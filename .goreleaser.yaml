# .goreleaser.yaml
# Simple GoReleaser configuration for AgentSecrets
# Documentation at https://goreleaser.com

version: 2

project_name: agentsecrets

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: agentsecrets
    main: ./cmd/agentsecrets/
    binary: agentsecrets
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/The-17/agentsecrets/cmd/agentsecrets/commands.Version={{.Version}}


archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - integrations/**/*
      - docs/**/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: agentsecrets
    repository:
      owner: The-17
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/The-17/agentsecrets"
    description: "Zero-knowledge credential firewall for the AI era"
    license: "MIT"
    install: |
      bin.install "agentsecrets"
    test: |
      system "#{bin}/agentsecrets --version"

release:
  github:
    owner: The-17
    name: agentsecrets
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  # The full release note lives in the docs site; this body is a summary plus a
  # pointer, followed by GoReleaser's generated commit list.
  header: |
    ## Fixed in v{{ .Version }}

    - **Windows `env`/`exec` no longer report a healthy daemon as missing.** `agentsecrets env` and `agentsecrets exec` open the keychain-auth named pipe twice in quick succession. keychain-auth serves one pipe instance at a time, so the second open can arrive while the daemon is setting up the next instance and Windows returns `ERROR_PIPE_BUSY`. Earlier releases mapped every connection failure to "daemon is not running", so `agentsecrets doctor` reported a healthy installation while `env` failed with `[ERR-999] keychain-auth daemon is not running`. The Windows client now waits for a free instance with `WaitNamedPipe` (bounded at 2 s), reports a busy daemon accurately without restarting it, and dials once instead of twice. No keychain-auth upgrade or re-authorization is required.

    **Full release notes:** https://docs.agentsecrets.tech/changelog/v3-x

    ---
