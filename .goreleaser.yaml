# .goreleaser.yaml
# Simple GoReleaser configuration for AgentSecrets
# Documentation at https://goreleaser.com

version: 2

project_name: agentsecrets

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: agentsecrets
    main: ./cmd/agentsecrets/
    binary: agentsecrets
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/The-17/agentsecrets/cmd/agentsecrets/commands.Version={{.Version}}


archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - integrations/**/*
      - docs/**/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: agentsecrets
    repository:
      owner: The-17
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/The-17/agentsecrets"
    description: "Zero-knowledge credential firewall for the AI era"
    license: "MIT"
    install: |
      bin.install "agentsecrets"
    test: |
      system "#{bin}/agentsecrets --version"

release:
  github:
    owner: The-17
    name: agentsecrets
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  # The full release note lives in the docs site; this body is a summary plus a
  # pointer, followed by GoReleaser's generated commit list.
  header: |
    ## Fixed in v{{ .Version }}

    Two bugs blocked any API that needs a lowercase JSON field or a Content-Type.

    - **Injection targets are no longer rewritten.** `--query`, `--body-field`, `--form-field` and `--header` put the target in a proxy control header name, which Go canonicalises on both sides of the wire, so `channel` arrived as `Channel` and `x-request-id` as `X.Request.Id`. Targets now travel in the header value (`X-AS-Inject-Body: channel=SLACK_CHANNEL_ID`) and are repeatable.
    - **JSON bodies get a Content-Type.** A plain `--body` went upstream untyped. It now defaults to `application/json`, and `--set-header Name=Value` sets any plain header explicitly.

    The legacy header-name form still parses, so existing scripts keep working. After upgrading, restart a running proxy with `agentsecrets proxy restart`.

    **Full release notes:** https://docs.agentsecrets.tech/changelog/v3-x

    ---
